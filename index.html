<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EIKROZ TOOLKIT: Nicks & Glitch</title>
  <style>
    /* --- ESTILOS GENERALES --- */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      /* Fuente del sistema segura */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #39ff14;
      background-color: #000;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      /* Matrix siempre se ve mejor con monospace */
      font-family: 'Courier New', monospace; 
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      padding-bottom: 80px;
    }

    h1, h2 {
      text-shadow: 0 0 10px #39ff14;
      margin-bottom: 5px;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 20px;
      text-align: center;
    }

    hr {
      width: 80%;
      border: 1px solid #39ff14;
      box-shadow: 0 0 10px #39ff14;
      margin: 40px 0;
      opacity: 0.5;
    }

    /* --- INPUT AREA --- */
    .input-container {
      background: rgba(0, 20, 0, 0.85);
      padding: 20px;
      border: 1px solid #39ff14;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
      z-index: 10;
    }

    input {
      padding: 12px;
      font-size: 18px;
      border-radius: 5px;
      border: 2px solid #333;
      background: #000;
      color: #fff;
      text-align: center;
      width: 250px;
      outline: none;
      font-family: inherit; 
    }

    input:focus {
      border-color: #39ff14;
      box-shadow: 0 0 10px #39ff14;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #39ff14;
      background: #000;
      color: #39ff14;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      margin: 5px;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
    }

    button:hover {
      background: #39ff14;
      color: #000;
      box-shadow: 0 0 15px #39ff14;
    }

    /* --- RESULTADOS SECCIÓN 1 --- */
    #results-container {
      width: 95%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
    }

    .nick-card {
      background: rgba(10, 10, 10, 0.9);
      border-left: 5px solid #39ff14;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
      position: relative;
      border-radius: 0 10px 10px 0;
    }

    .nick-label {
      font-size: 10px;
      color: #888;
      position: absolute;
      top: 4px;
      left: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Courier New', monospace;
    }

    .nick-text {
      font-size: 22px;
      margin-top: 12px;
      word-break: break-all;
      color: #fff;
      text-shadow: 0 0 2px rgba(255,255,255,0.5);
    }

    /* --- LABORATORIO GLITCH (SECCIÓN 2) --- */
    #glitch-lab {
      text-align: center;
      background: rgba(0, 0, 0, 0.9);
      padding: 20px;
      border: 1px dashed #39ff14;
      border-radius: 15px;
      width: 90%;
      max-width: 700px;
    }

    #output-manual {
      margin-top: 20px;
      font-size: 28px;
      min-height: 60px;
      padding: 20px;
      word-wrap: break-word; /* Rompe palabras largas para que no se salgan */
      word-break: break-all;
      border: 1px solid #333;
      background: #050505;
      color: #fff;
      animation: glitchAnim 1s infinite;
      /* Forzamos fuente normal para asegurar compatibilidad */
      font-family: sans-serif;
    }

    @keyframes glitchAnim {
      0%   { text-shadow: 2px 0 red, -2px 0 cyan; }
      25%  { text-shadow: -2px -2px magenta, 2px 2px lime; }
      50%  { text-shadow: 2px -2px blue, -2px 2px yellow; }
      75%  { text-shadow: -1px 0 orange, 1px 1px violet; }
      100% { text-shadow: 0 0 #39ff14; }
    }

    /* Toast Notification */
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #222;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 16px;
      position: fixed;
      z-index: 100;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      border-bottom: 4px solid #39ff14;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    #toast.show {
      visibility: visible;
      animation: fadein 0.5s, fadeout 0.5s 2.5s;
    }

    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <h1>TAG HYPERNOVA Ϟ</h1>
  <p class="subtitle">Generador creado por @eikroz</p>
  
  <div class="input-container">
    <span style="font-size: 24px; color: #fff; font-family: sans-serif;">「Ϟ」</span>
    <input id="inputNick" type="text" placeholder="Tu Nombre" value="eikroz" oninput="generarNicks()">
  </div>

  <div id="results-container"></div>

  <hr>

  <div id="glitch-lab">
    <h2>GENERADOR GLITCH PRO+</h2>
    <p class="subtitle">Modo Manual: Protege el clan 「Ϟ」 automáticamente</p>
    
    <input id="inputGlitch" placeholder="Ej: 「Ϟ」Eikroz" value="「Ϟ」eikroz">
    <br>
    <div style="margin-top: 10px;">
        <button onclick="glitchearManual()">GLITCHEAR</button>
        <button onclick="añadirRuidoManual()">AÑADIR RUIDO</button>
        <button onclick="copiarManual()">COPIAR</button>
    </div>

    <div id="output-manual"></div>
  </div>

  <div id="toast">¡Copiado al portapapeles!</div>

  <script>
    // ---------------------------------------------------------
    // 1. CONFIGURACIÓN
    // ---------------------------------------------------------
    const fonts = {
      soft: {
        name: "SOFT ❀",
        suffix: "❀", 
        map: { a:'α', b:'b', c:'c', d:'d', e:'ε', f:'f', g:'g', h:'h', i:'ı', j:'ȷ', k:'k', l:'l', m:'m', n:'n', o:'o', p:'p', q:'q', r:'r', s:'s', t:'t', u:'υ', v:'v', w:'w', x:'x', y:'y', z:'z', A:'Α', B:'Β', C:'C', D:'D', E:'Ε', F:'F', G:'G', H:'H', I:'Ι', J:'J', K:'Κ', L:'L', M:'Μ', N:'Ν', O:'Ο', P:'Ρ', Q:'Q', R:'R', S:'S', T:'Τ', U:'Υ', V:'V', W:'W', X:'Χ', Y:'Y', Z:'Ζ' }
      },
      smallCaps: {
        name: "VETERANO",
        map: { a:'ᴀ', b:'ʙ', c:'ᴄ', d:'ᴅ', e:'ᴇ', f:'ғ', g:'ɢ', h:'ʜ', i:'ɪ', j:'ᴊ', k:'ᴋ', l:'ʟ', m:'ᴍ', n:'ɴ', o:'ᴏ', p:'ᴘ', q:'ǫ', r:'ʀ', s:'s', t:'ᴛ', u:'ᴜ', v:'ᴠ', w:'ᴡ', x:'x', y:'ʏ', z:'ᴢ' }
      },
      gothic: {
        name: "TÓXICO",
        map: { a:'𝖆', b:'𝖇', c:'𝖈', d:'𝖉', e:'𝖊', f:'𝖋', g:'𝖌', h:'𝖍', i:'𝖎', j:'𝖏', k:'𝖐', l:'𝖑', m:'𝖒', n:'𝖓', o:'𝖔', p:'𝖕', q:'𝖖', r:'𝖗', s:'𝖘', t:'𝖙', u:'𝖚', v:'𝖛', w:'𝖜', x:'𝖝', y:'𝖞', z:'𝖟', A:'𝕬', B:'𝕭', C:'𝕮', D:'𝕯', E:'𝕰', F:'𝕱', G:'𝕲', H:'𝕳', I:'𝕴', J:'𝕵', K:'𝕶', L:'𝕷', M:'𝕸', N:'𝕹', O:'𝕺', P:'𝕻', Q:'𝕼', R:'𝕽', S:'𝕾', T:'𝕿', U:'𝖀', V:'𝖁', W:'𝖂', X:'𝖃', Y:'𝖄', Z:'𝖅' }
      },
      script: {
        name: "INSANO",
        map: { a:'𝓪', b:'𝓫', c:'𝓬', d:'𝓭', e:'𝓮', f:'𝓯', g:'𝓰', h:'𝓱', i:'𝓲', j:'𝓳', k:'𝓴', l:'𝓵', m:'𝓶', n:'𝓷', o:'𝓸', p:'𝓹', q:'𝓺', r:'𝓻', s:'𝓼', t:'𝓽', u:'𝓾', v:'𝓿', w:'𝔀', x:'𝔁', y:'𝔂', z:'𝔃', A:'𝓐', B:'𝓑', C:'𝓒', D:'𝓓', E:'𝓔', F:'𝓕', G:'𝓖', H:'𝓗', I:'𝓘', J:'𝓙', K:'𝓚', L:'𝓛', M:'𝓜', N:'𝓝', O:'𝓞', P:'𝓟', Q:'𝓠', R:'𝓡', S:'𝓢', T:'𝓣', U:'𝓤', V:'𝓥', W:'𝓦', X:'𝓧', Y:'𝓨', Z:'𝓩' }
      },
      double: {
        name: "DOBLE",
        map: { a:'𝕒', b:'𝕓', c:'𝕔', d:'𝕕', e:'𝕖', f:'𝕗', g:'𝕘', h:'𝕙', i:'𝕚', j:'𝕛', k:'𝕜', l:'𝕝', m:'𝕞', n:'𝕟', o:'𝕠', p:'𝕡', q:'𝕢', r:'𝕣', s:'𝕤', t:'𝕥', u:'𝕦', v:'𝕧', w:'𝕨', x:'𝕩', y:'𝕪', z:'𝕫', A:'𝔸', B:'𝔹', C:'ℂ', D:'𝔻', E:'𝔼', F:'𝔽', G:'𝔾', H:'ℍ', I:'𝕀', J:'𝕁', K:'𝕂', L:'𝕃', M:'𝕄', N:'ℕ', O:'𝕆', P:'ℙ', Q:'ℚ', R:'ℝ', S:'𝕊', T:'𝕋', U:'𝕌', V:'𝕍', W:'𝕎', X:'𝕏', Y:'𝕐', Z:'ℤ' }
      }
    };

    // Símbolos para "ensuciar" el texto (Diacríticos Zalgo)
    const diacritics = ['͓','ͣ','ͫ','̸','͢','ͥ','͜','ͦ','ͧ','̷','̽','͘'];
    const glitches = ['ₓ','𓂀','᯾','҂','Ꙭ','꯱','ৣ','۞','۩','҉','₪','᠎'];

    // ---------------------------------------------------------
    // 2. LÓGICA DE LA SECCIÓN 1 (NICKS)
    // ---------------------------------------------------------
    function transformarTexto(texto, mapa) {
      return texto.split('').map(char => mapa[char] || mapa[char.toLowerCase()] || char).join('');
    }

    function generarNicks() {
      const input = document.getElementById('inputNick').value;
      const container = document.getElementById('results-container');
      const prefix = "「Ϟ」"; 
      
      container.innerHTML = ""; 

      if (!input) return;

      for (const key in fonts) {
        const estilo = fonts[key];
        let nombreTransformado = transformarTexto(input, estilo.map);
        if (estilo.suffix) nombreTransformado += estilo.suffix;
        crearTarjeta(estilo.name, prefix + nombreTransformado);
      }
      crearTarjeta("ORIGINAL", prefix + input);
    }

    function crearTarjeta(etiqueta, textoFinal) {
      const container = document.getElementById('results-container');
      const div = document.createElement('div');
      div.className = 'nick-card';
      div.innerHTML = `
        <div>
          <span class="nick-label">${etiqueta}</span>
          <div class="nick-text">${textoFinal}</div>
        </div>
        <button onclick="copiar('${textoFinal}')">COPIAR</button>
      `;
      container.appendChild(div);
    }

    // ---------------------------------------------------------
    // 3. LÓGICA DE LA SECCIÓN 2 (GLITCH MANUAL)
    // ---------------------------------------------------------
    
    // CORRECCIÓN: Ya no reemplazamos las letras por símbolos matemáticos raros.
    // Usamos la letra original y le pegamos "ruido" encima.
    function glitchearManual() {
      const input = document.getElementById('inputGlitch').value;
      const clanTag = "「Ϟ」";
      
      let prefix = "";
      let textoParaProcesar = input;

      // 🛑 DETECCIÓN DEL CLAN
      if (input.startsWith(clanTag)) {
        prefix = clanTag;
        textoParaProcesar = input.substring(clanTag.length);
      }

      let output = '';
      for (let char of textoParaProcesar) {
        // En vez de buscar en un mapa de fuentes raras, usamos el 'char' original
        // Y le agregamos un diacrítico aleatorio para el efecto glitch
        const glitch = diacritics[Math.floor(Math.random() * diacritics.length)];
        output += char + glitch; 
      }
      
      document.getElementById('output-manual').innerText = prefix + output;
    }

    function añadirRuidoManual() {
      let text = document.getElementById('output-manual').innerText;
      const clanTag = "「Ϟ」";
      
      let prefix = "";
      let parteEditable = text;

      if (text.startsWith(clanTag)) {
        prefix = clanTag;
        parteEditable = text.substring(clanTag.length);
      }

      let noisy = '';
      for (let char of parteEditable) {
        noisy += char;
        // 30% de probabilidad de agregar más basura
        if (Math.random() < 0.3) {
          noisy += glitches[Math.floor(Math.random() * glitches.length)];
        }
      }
      
      document.getElementById('output-manual').innerText = prefix + noisy;
    }

    function copiarManual() {
      const text = document.getElementById('output-manual').innerText;
      copiar(text);
    }

    // ---------------------------------------------------------
    // 4. UTILIDADES GLOBALES
    // ---------------------------------------------------------
    function copiar(texto) {
      if (!texto) return;
      navigator.clipboard.writeText(texto).then(() => {
        mostrarToast();
      });
    }

    function mostrarToast() {
      const toast = document.getElementById("toast");
      toast.className = "show";
      setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // ---------------------------------------------------------
    // 5. FONDO MATRIX
    // ---------------------------------------------------------
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789".split("");
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array.from({ length: columns }, () => 1);

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#39ff14";
      ctx.font = `${fontSize}px monospace`;
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);
    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    window.onload = generarNicks;

  </script>
</body>
</html>
