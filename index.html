<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EIKROZ TOOLKIT: Nicks & Glitch</title>
  <style>
    /* --- ESTILOS GENERALES --- */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #39ff14;
      background-color: #000;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      font-family: 'Courier New', monospace; 
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      padding-bottom: 80px;
    }

    h1, h2 {
      text-shadow: 0 0 10px #39ff14;
      margin-bottom: 5px;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 20px;
      text-align: center;
    }

    hr {
      width: 80%;
      border: 1px solid #39ff14;
      box-shadow: 0 0 10px #39ff14;
      margin: 40px 0;
      opacity: 0.5;
    }

    /* --- SECCIÓN 1: INPUT AREA --- */
    .input-container {
      background: rgba(0, 20, 0, 0.85);
      padding: 20px;
      border: 1px solid #39ff14;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      z-index: 10;
      max-width: 90%;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    input.main-input {
      padding: 12px;
      font-size: 18px;
      border-radius: 5px;
      border: 2px solid #333;
      background: #000;
      color: #fff;
      text-align: center;
      width: 250px;
      outline: none;
      font-family: inherit; 
    }

    input.main-input:focus {
      border-color: #39ff14;
      box-shadow: 0 0 10px #39ff14;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #39ff14;
      background: #000;
      color: #39ff14;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      margin: 5px;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
    }

    button:hover {
      background: #39ff14;
      color: #000;
      box-shadow: 0 0 15px #39ff14;
    }

    /* --- RESULTADOS SECCIÓN 1 --- */
    #results-container {
      width: 95%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
    }

    .nick-card {
      background: rgba(10, 10, 10, 0.9);
      border-left: 5px solid #39ff14;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
      position: relative;
      border-radius: 0 10px 10px 0;
    }

    .nick-label {
      font-size: 10px;
      color: #888;
      position: absolute;
      top: 4px;
      left: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Courier New', monospace;
    }

    .nick-text {
      font-size: 22px;
      margin-top: 12px;
      word-break: break-all;
      color: #fff;
      text-shadow: 0 0 2px rgba(255,255,255,0.5);
    }

    /* --- SECCIÓN 2: EDITOR GLITCH --- */
    #glitch-lab {
      text-align: center;
      background: rgba(0, 0, 0, 0.9);
      padding: 20px;
      border: 1px dashed #39ff14;
      border-radius: 15px;
      width: 90%;
      max-width: 700px;
      margin-bottom: 50px;
    }

    .glitch-input-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border: 2px solid #333;
      border-radius: 5px;
      width: fit-content;
      margin: 0 auto;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    
    .glitch-input-wrapper:focus-within {
      border-color: #39ff14;
      box-shadow: 0 0 10px #39ff14;
    }

    /* Animación de ERROR (Shake + Rojo momentáneo) */
    .input-error-anim {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
      border-color: #ff3333 !important;
      box-shadow: 0 0 15px #ff3333 !important;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .static-prefix {
      background: #111;
      color: #888;
      padding: 12px 5px 12px 12px;
      font-size: 18px;
      font-family: inherit;
      border-right: 1px solid #333;
      user-select: none;
    }

    #inputGlitch {
      padding: 12px;
      font-size: 18px;
      background: #000;
      color: #fff;
      border: none;
      outline: none;
      width: 200px;
      font-family: inherit;
    }

    /* Panel de Botones */
    .effects-panel {
      background: rgba(0,20,0,0.5);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .effect-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .group-label {
      font-size: 11px;
      color: #888;
      width: 60px;
      text-align: right;
      margin-right: 5px;
      font-weight: bold;
    }

    .mini-btn {
      padding: 6px 10px;
      font-size: 16px;
      margin: 2px;
      min-width: 40px;
      border: 1px solid #39ff14;
      background: #000;
      color: #fff;
      cursor: pointer;
    }
    
    .mini-btn:hover {
      background: #39ff14;
      color: #000;
    }

    /* Toast Notification */
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #222;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 16px;
      position: fixed;
      z-index: 100;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      border-bottom: 4px solid #39ff14;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    #toast.show {
      visibility: visible;
      animation: fadein 0.5s, fadeout 0.5s 2.5s;
    }

    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <h1>TAG HYPERNOVA</h1>
  <p class="subtitle">Generador creado por @eikroz</p>
  
  <div class="input-container">
    <div class="input-row">
      <span style="font-size: 24px; color: #fff; font-family: sans-serif;">「Ϟ」</span>
      <input id="inputNick" class="main-input" type="text" placeholder="Nombre" value="" oninput="generarNicks()" maxlength="9">
    </div>
  </div>

  <div id="results-container"></div>

  <hr>

  <div id="glitch-lab">
    <h2>EDITOR GLITCH MANUAL</h2>
    <p class="subtitle">Personaliza letra por letra.</p>
    
    <div id="char-counter" style="font-family: 'Courier New'; font-size: 18px; color: #39ff14; margin-bottom: 10px;">
      CARACTERES: <span id="current-count">3</span> / 12
    </div>

    <div class="glitch-input-wrapper">
      <span class="static-prefix">「Ϟ」</span>
      <input id="inputGlitch" placeholder="Escribe..." oninput="actualizarContador()" onkeydown="verificarLimiteEscritura(event)" maxlength="9">
    </div>
    
    <div class="effects-panel">
      <div class="effect-group">
        <span class="group-label">ARRIBA:</span>
        <button class="mini-btn" onclick="addSymbol('ͣ')">ᵃ</button>
        <button class="mini-btn" onclick="addSymbol('ͫ')">ᵐ</button>
        <button class="mini-btn" onclick="addSymbol('ͥ')">ⁱ</button>
        <button class="mini-btn" onclick="addSymbol('ͦ')">ᵒ</button>
        <button class="mini-btn" onclick="addSymbol('ͧ')">ᵘ</button>
        <button class="mini-btn" onclick="addSymbol('̽')">x</button>
        <button class="mini-btn" onclick="addSymbol('͘')">●</button>
      </div>

      <div class="effect-group">
        <span class="group-label">MEDIO:</span>
        <button class="mini-btn" onclick="addSymbol('̸')">SLASH</button>
        <button class="mini-btn" onclick="addSymbol('̷')">/</button>
        <button class="mini-btn" onclick="addSymbol('̶')">-</button>
      </div>

      <div class="effect-group">
        <span class="group-label">ABAJO:</span>
        <button class="mini-btn" onclick="addSymbol('̣')">.</button>
        <button class="mini-btn" onclick="addSymbol('͢')">⮕</button>
        <button class="mini-btn" onclick="addSymbol('͓')">x</button>
        <button class="mini-btn" onclick="addSymbol('͜')">‿</button>
        <button class="mini-btn" onclick="addSymbol('̰')">~</button>
      </div>
    </div>

    <br>
    <button onclick="copiarGlitch()" style="width: 100%; max-width: 300px;">COPIAR RESULTADO</button>
  </div>

  <div id="toast">¡Copiado al portapapeles!</div>

  <script>
    // ---------------------------------------------------------
    // 1. CONFIGURACIÓN DE FUENTES
    // ---------------------------------------------------------
    const fonts = {
      soft: {
        name: "SOFT ❀",
        suffix: "❀", 
        map: { a:'α', b:'b', c:'c', d:'d', e:'ε', f:'f', g:'g', h:'h', i:'ı', j:'ȷ', k:'k', l:'l', m:'m', n:'n', o:'o', p:'p', q:'q', r:'r', s:'s', t:'t', u:'υ', v:'v', w:'w', x:'x', y:'y', z:'z', A:'Α', B:'Β', C:'C', D:'D', E:'Ε', F:'F', G:'G', H:'H', I:'Ι', J:'J', K:'Κ', L:'L', M:'Μ', N:'Ν', O:'Ο', P:'Ρ', Q:'Q', R:'R', S:'S', T:'Τ', U:'Υ', V:'V', W:'W', X:'Χ', Y:'Y', Z:'Ζ' }
      },
      smallCaps: {
        name: "VETERANO",
        map: { a:'ᴀ', b:'ʙ', c:'ᴄ', d:'ᴅ', e:'ᴇ', f:'ғ', g:'ɢ', h:'ʜ', i:'ɪ', j:'ᴊ', k:'ᴋ', l:'ʟ', m:'ᴍ', n:'ɴ', o:'ᴏ', p:'ᴘ', q:'ǫ', r:'ʀ', s:'s', t:'ᴛ', u:'ᴜ', v:'ᴠ', w:'ᴡ', x:'x', y:'ʏ', z:'ᴢ' }
      },
      gothic: {
        name: "TÓXICO",
        map: { a:'𝖆', b:'𝖇', c:'𝖈', d:'𝖉', e:'𝖊', f:'𝖋', g:'𝖌', h:'𝖍', i:'𝖎', j:'𝖏', k:'𝖐', l:'𝖑', m:'𝖒', n:'𝖓', o:'𝖔', p:'𝖕', q:'𝖖', r:'𝖗', s:'𝖘', t:'𝖙', u:'𝖚', v:'𝖛', w:'𝖜', x:'𝖝', y:'𝖞', z:'𝖟', A:'𝕬', B:'𝕭', C:'𝕮', D:'𝕯', E:'𝕰', F:'𝕱', G:'𝕲', H:'𝕳', I:'𝕴', J:'𝕵', K:'𝕶', L:'𝕷', M:'𝕸', N:'𝕹', O:'𝕺', P:'𝕻', Q:'𝕼', R:'𝕽', S:'𝕾', T:'𝕿', U:'𝖀', V:'𝖁', W:'𝖂', X:'𝖃', Y:'𝖄', Z:'𝖅' }
      },
      script: {
        name: "INSANO",
        map: { a:'𝓪', b:'𝓫', c:'𝓬', d:'𝓭', e:'𝓮', f:'𝓯', g:'𝓰', h:'𝓱', i:'𝓲', j:'𝓳', k:'𝓴', l:'𝓵', m:'𝓶', n:'𝓷', o:'𝓸', p:'𝓹', q:'𝓺', r:'𝓻', s:'𝓼', t:'𝓽', u:'𝓾', v:'𝓿', w:'𝔀', x:'𝔁', y:'𝔂', z:'𝔃', A:'𝓐', B:'𝓑', C:'𝓒', D:'𝓓', E:'𝓔', F:'𝓕', G:'𝓖', H:'𝓗', I:'𝓘', J:'𝓙', K:'𝓚', L:'𝓛', M:'𝓜', N:'𝓝', O:'𝓞', P:'𝓟', Q:'𝓠', R:'𝓡', S:'𝓢', T:'𝓣', U:'𝓤', V:'𝓥', W:'𝓦', X:'𝓧', Y:'𝓨', Z:'𝓩' }
      },
      double: {
        name: "DOBLE",
        map: { a:'𝕒', b:'𝕓', c:'𝕔', d:'𝕕', e:'𝕖', f:'𝕗', g:'𝕘', h:'𝕙', i:'𝕚', j:'𝕛', k:'𝕜', l:'𝕝', m:'𝕞', n:'𝕟', o:'𝕠', p:'𝕡', q:'𝕢', r:'𝕣', s:'𝕤', t:'𝕥', u:'𝕦', v:'𝕧', w:'𝕨', x:'𝕩', y:'𝕪', z:'𝕫', A:'𝔸', B:'𝔹', C:'ℂ', D:'𝔻', E:'𝔼', F:'𝔽', G:'𝔾', H:'ℍ', I:'𝕀', J:'𝕁', K:'𝕂', L:'𝕃', M:'𝕄', N:'ℕ', O:'𝕆', P:'ℙ', Q:'ℚ', R:'ℝ', S:'𝕊', T:'𝕋', U:'𝕌', V:'𝕍', W:'𝕎', X:'𝕏', Y:'𝕐', Z:'ℤ' }
      }
    };

    // ---------------------------------------------------------
    // 2. LOGICA SECCIÓN 1 (GENERACIÓN AUTOMÁTICA)
    // ---------------------------------------------------------
    function transformarTexto(texto, mapa) {
      return texto.split('').map(char => mapa[char] || mapa[char.toLowerCase()] || char).join('');
    }

    function generarNicks() {
      let inputElement = document.getElementById('inputNick');
      
      // Validación extra
      if ([...inputElement.value].length > 9) {
          inputElement.value = [...inputElement.value].slice(0, 9).join('');
      }
      
      const input = inputElement.value;
      const container = document.getElementById('results-container');
      const prefix = "「Ϟ」"; 
      
      container.innerHTML = ""; 

      if (!input) return;

      const cortarTexto = (texto) => {
        const arrayTexto = [...texto];
        if (arrayTexto.length > 12) return arrayTexto.slice(0, 12).join('');
        return texto;
      };

      for (const key in fonts) {
        const estilo = fonts[key];
        let nombreTransformado = transformarTexto(input, estilo.map);
        if (estilo.suffix) nombreTransformado += estilo.suffix;
        
        let textoCompleto = prefix + nombreTransformado;
        textoCompleto = cortarTexto(textoCompleto);

        crearTarjeta(estilo.name, textoCompleto);
      }
      
      let originalFinal = prefix + input;
      originalFinal = cortarTexto(originalFinal);
      crearTarjeta("ORIGINAL", originalFinal);
    }

    function crearTarjeta(etiqueta, textoFinal) {
      const container = document.getElementById('results-container');
      const div = document.createElement('div');
      div.className = 'nick-card';
      div.innerHTML = `
        <div>
          <span class="nick-label">${etiqueta}</span>
          <div class="nick-text">${textoFinal}</div>
        </div>
        <button onclick="copiar('${textoFinal}')">COPIAR</button>
      `;
      container.appendChild(div);
    }

    // ---------------------------------------------------------
    // 3. LOGICA SECCIÓN 2 (EDITOR GLITCH MANUAL)
    // ---------------------------------------------------------

    function actualizarContador() {
      const input = document.getElementById('inputGlitch');
      const counterDisplay = document.getElementById('current-count');
      const wrapper = document.querySelector('.glitch-input-wrapper');
      
      // Validación extra para pegar texto
      if ([...input.value].length > 9) {
          input.value = [...input.value].slice(0, 9).join('');
      }

      const prefixLength = 3;
      const userLength = [...input.value].length;
      const totalLength = prefixLength + userLength;
      
      counterDisplay.innerText = totalLength;

      // ELIMINADO: Ya no ponemos la clase roja fija si llega a 12.
      // El borde se queda normal (verde/neutro) aunque esté lleno.
      
      return totalLength;
    }

    // NUEVA FUNCIÓN: Detecta si escriben cuando ya está lleno
    function verificarLimiteEscritura(e) {
      const input = e.target;
      const isControlKey = e.key.length > 1 || e.ctrlKey || e.metaKey || e.altKey;
      
      if (!isControlKey) {
        // Si ya hay 9 caracteres (Total 12) e intentan escribir otro
        if ([...input.value].length >= 9) {
           triggerErrorAnim();
        }
      }
    }

    function triggerErrorAnim() {
      const wrapper = document.querySelector('.glitch-input-wrapper');
      // Reiniciamos la animación quitando y poniendo la clase
      wrapper.classList.remove('input-error-anim');
      void wrapper.offsetWidth; // Forzar reflow
      wrapper.classList.add('input-error-anim');
      
      // Quitar la clase después de que termine la animación
      setTimeout(() => {
        wrapper.classList.remove('input-error-anim');
      }, 400);
    }

    function addSymbol(symbol) {
      const input = document.getElementById('inputGlitch');
      const currentTotal = actualizarContador(); 

      // Si intentan agregar un símbolo y ya son 12
      if (currentTotal >= 12) {
        mostrarToast("⛔ Lleno (Max 12)");
        triggerErrorAnim(); // También hacemos vibrar la caja
        return;
      }

      input.value += symbol;
      actualizarContador();
      input.focus(); 
    }

    function copiarGlitch() {
      const input = document.getElementById('inputGlitch');
      const fullText = "「Ϟ」" + input.value;
      copiar(fullText);
    }

    // ---------------------------------------------------------
    // 4. UTILIDADES GLOBALES
    // ---------------------------------------------------------
    function copiar(texto) {
      if (!texto) return;
      navigator.clipboard.writeText(texto).then(() => {
        mostrarToast("¡Copiado al portapapeles!");
      });
    }

    function mostrarToast(mensaje) {
      const toast = document.getElementById("toast");
      if(mensaje) toast.innerText = mensaje;
      toast.className = "show";
      setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // ---------------------------------------------------------
    // 5. FONDO MATRIX
    // ---------------------------------------------------------
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789".split("");
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array.from({ length: columns }, () => 1);

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#39ff14";
      ctx.font = `${fontSize}px monospace`;
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    
    // Iniciar
    setInterval(drawMatrix, 33);
    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    window.onload = function() {
      generarNicks();
      actualizarContador(); 
    };

  </script>
</body>
</html>
